# Files the packager copies into the module zip.
#
# format: <path relative to the repository root>=<path inside the module>
#
# The device-facing tool stays a single implementation: the script in tools/ is
# shipped verbatim into bin/ instead of being duplicated here, so a fix to the
# tool cannot drift away from the module.  It is the on-demand, verdict-carrying
# version of what abk_report_dvfs_state() logs at boot, and it belongs with the
# scheduling half rather than with the memory one.
tools/abk_fas_check.sh=bin/abk_fas_check.sh
