# Files the packager copies into the module zip.
#
# format: <path relative to the repository root>=<path inside the module>
#
# The device-facing tools stay a single implementation: the scripts in tools/
# are shipped verbatim into bin/ instead of being duplicated here, so a fix to a
# tool cannot drift away from the module.
tools/zram_recompress_trigger.sh=bin/zram_recompress_trigger.sh
tools/cached_freeze_reclaim.sh=bin/cached_freeze_reclaim.sh
tools/abk_psi_policy.sh=bin/abk_psi_policy.sh
tools/abk_psi_bench.sh=bin/abk_psi_bench.sh
tools/abk_launch_bench.sh=bin/abk_launch_bench.sh
tools/abk_scx_check.sh=bin/abk_scx_check.sh

# --- sched_ext (SCX) userspace pair (Batches 61-65) -----------------------
# Both are build products committed under tools/scx/prebuilt/: the scheduler
# object is compiled against the grafted kernel's own BTF, and the loader is
# cross-built for aarch64-linux-android (the recipe is tools/scx/README.md and
# tools/scx/build_android_loader.sh).  scx-policy.sh starts nothing unless both
# are present AND scx.enabled=1.
tools/scx/prebuilt/scx_loader=bin/scx_loader
tools/scx/prebuilt/abk_scx_min.bpf.o=bin/abk_scx_min.bpf.o
