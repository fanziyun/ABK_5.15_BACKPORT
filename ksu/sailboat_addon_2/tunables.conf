# tunables.conf - sailboat addon 2 (ABK cpufreq/scheduler runtime tunables).
#
# Values are read by abk_cfg <key> <default>: an empty value means "leave the
# kernel alone", so every key here may be blanked to opt out.  An unrecognised
# key is reported once at boot and ignored, so a typo changes nothing silently.
#
# This file is the scheduling half, moved out of the ABK runtime tunables module
# (sailboat addon 1) unchanged apart from the header.  The band, the governor
# enforcement interval and the measured reasons behind both travel with it.

# --- scheduler / readahead (empty = leave alone) -------------------------

# --- the governor every policy is held on --------------------------------
# Measured on vermeer / android13-5.15 5.15.216 with SELinux Enforcing:
# the policy starts on walt, and `scaling_governor` is 0444 root:root, so even a
# root shell's write returns EACCES.  *chmod 0644 on the node as root succeeds,
# and the write then succeeds* -- and the permission stays open afterwards.
# What happens next is the part that makes this a supervisor rather than a boot
# script: the vendor writes walt back.  Over one session the node was seen go
# schedutil -> walt between two measurements taken ~15 minutes apart while the
# permissions were still the 0644 this module had left behind (mtime on the node
# confirms the write), and it was still schedutil after a 60 s watch, so the
# revert is event-driven (a scene/profile change), not continuous.  Hence a
# periodic re-assert instead of a one-shot.
#
# What is *not* settled is the trigger.  It reverted at least once in the ~15
# minutes between setting it and the next check, with the permissions still the
# 0644 this module had left behind -- so the vendor rewrote the value without
# re-locking the node -- and it did not revert during a 60 s watch.  The revert
# therefore looks like a scene/profile change (scene-daemon, which holds
# scaling_max_freq open on every policy, restarts on its own schedule), but the
# writer has not been identified, so the interval below is set for "catches a
# change within a minute", not for "keeps up with the writer".
#
# Empty = do not touch the governor: the ROM's own choice stands and neither
# the supervisor nor the boot pass runs.
sched.abk_governor=schedutil
# How often the supervisor re-checks.  The vendor's own switch to schedutil
# during games is a write the module then finds already-correct, so a game costs
# three reads and no write.
sched.abk_governor_interval_sec=30

# --- smart-freq floor + cap: the band, and why the two ends never meet ---
#
# Armed on purpose for this device.  Measured while gaming: the scheduler
# profile in play puts the policy on *schedutil*, which is the one governor
# abk_sf_owns() / abk_sf_dvfs_owned()/abk_sc_dvfs_owned() let through.  The
# boot-time log still shows walt because that snapshot is taken at post-fs-data,
# before any profile has switched anything -- so "walt at boot" and "schedutil in
# a game" are both true, and the second is when these two matter.
#
# The band.  floor_pct is a floor: while any CPU of a policy has been at >=90%
# of its capacity for 300 ms, resolve_freq raises the target to at least
# floor_pct of cpuinfo.max_freq.  cap_pct is a ceiling: above it the target is
# clamped, unless requests have stayed above it for 300 ms.  They compose into a
# band [floor_pct, cap_pct] that demand moves freely inside, with the floor
# catching dips during sustained load and the cap catching peaks above it.
#
#   floor_pct=85  <--->  cap_pct=90     (5 points of headroom, measured minimum)
#
# Why 90 and not the 95 this shipped with before: measured on vermeer /
# 5.15.216 after the governor was put on schedutil globally, the vendor pins
# scaling_max_freq to 92-94% of cpuinfo.max_freq on all three policies
# (1900800/2016000 = 94.3%, 2592000/2803200 = 92.5%, 2956800/3187200 = 92.8%).
# abk_sc_owns() refuses when cap >= policy->max, so a cap_pct anywhere above
# those pins is refused on every policy every time -- which is what 95 was: the
# feature was armed and never once ran.  90 puts the cap below all three pins
# (1814400 / 2522880 / 2868480) and keeps a 5-point band, which is the narrowest
# the band is allowed to be before it becomes the ratchet described below.  If
# the vendor's pins move up again, check abk_sc_capped: unchanged forever means
# the cap is being refused for this reason again.
#
# The inequality is load-bearing.  If cap_pct ever drops to floor_pct or below,
# the floor lifts the target to floor_pct on the first probe of every
# resolve_freq call and the cap's re-assert probe (registered at
# late_initcall_sync, so it runs *after* the floor) clamps it straight back --
# on every single frequency update, forever.  The cluster then pins at that one
# frequency the moment sustained load appears: that is the Batch 10-4c ratchet,
# which is the reason this cap exists at all.  Lowering cap_pct below 85 is
# therefore not a bigger cap, it is a lock.  If you want a tighter ceiling,
# lower floor_pct first and keep the gap.
#
# The three timed knobs below are written at the kernel's own defaults (300 ms
# sustained / 250 ms exit, 300 ms hold, 70% release), so stating them changes
# nothing today -- they are here so the next edit starts from the shipped values
# rather than from an empty line that means "whatever the kernel happens to
# default to".
#
# sched.abk_sc_entry_pct has no knob: it feeds only the read-only abk_sc_boosting
# election and gates no decision, so a writable copy would be a number that
# looks like it tunes the clamp and does not.  Set to 1 for the two enables ONLY
# on a schedutil device; on anything else abk_sf_owns()/abk_sc_owns() refuse and
# nothing happens (which is the desired outcome, not a bug).  Verify with
# bin/abk_fas_check.sh --probe -- it answers "park or lock?" after applying load
# and confirming the frequency comes back down.
sched.abk_sf_enable=1
sched.abk_sf_floor_pct=85
sched.abk_sf_sustained_ms=300
sched.abk_sf_exit_ms=250
sched.abk_sc_enable=1
sched.abk_sc_cap_pct=90
sched.abk_sc_hold_ms=300
sched.abk_sc_release_pct=70
sched.abk_sc_release_ms=250
