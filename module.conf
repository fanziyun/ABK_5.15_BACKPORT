ABK_MODULE_ID="abk_5_15_backport"
ABK_MODULE_NAME="ABK 5.15 LTS Backport"
ABK_MODULE_VERSION="0.1.0"
ABK_MODULE_DESCRIPTION="Backports feature, optimization, and structural-refactor commits from the upstream 5.15.y LTS stream (v5.15.167..v5.15.218) onto the android13-5.15 GKI baseline (5.15.167), implemented as bounded anchor grafts. Security-only fixes are out of scope. Designed to stack with ABK_F2FS_FIX_MODULE (storage rollback runs first) and ABK_ABI_PATCH_SUITE (which runs last and adapts to the upstream fdtable shape this module lands). Groups whose anchors are missing degrade to report-only instead of failing the build."
ABK_MODULE_REPO_URL="https://github.com/xingguangcuican6666/ABK_5.15_backport.git"
ABK_MODULE_SUPPORTED_STAGES="after_patch,before_build"
ABK_MODULE_DEFAULT_STAGE="after_patch"
ABK_MODULE_RECOMMENDED_STAGES="after_patch"

ABK_MODULE_KIND="module_set"
ABK_MODULE_SET_ID="abk_5_15_backport"
ABK_MODULE_SET_NAME="ABK 5.15 LTS Backport"
ABK_MODULE_SET_VERSION="0.1.0"
ABK_MODULE_SET_DESCRIPTION="Feature/optimization backport line for android13-5.15: stable_backport_core carries the fd table conventions, page_alloc reserve/THP semantics, and cgroup grafts; stable_perf_backport carries the scheduler NOHZ/PSI/RT, kstack randomization, networking, locking, block PM, and OOM observability grafts."

