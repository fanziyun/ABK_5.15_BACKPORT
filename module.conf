ABK_MODULE_ID="abk_5_15_backport"
ABK_MODULE_NAME="ABK 5.15 LTS Backport"
ABK_MODULE_VERSION="0.44.0"
ABK_MODULE_DESCRIPTION="Standalone feature, optimization, structural-refactor backport and display-bringup fix line for the android13-5.15 GKI baselines 5.15.167/.178/.194, grafting selected upstream 5.15.y commits (v5.15.167..v5.15.218; since Batch 20 every non-churn candidate of that survey is either landed or documented as a no-op on the only target architecture, and no group degrades to blocked_by_shape on any supported baseline), the android14-6.1 ACK line (memory.reclaim, PSI IRQ/kernfs polling, the PSI ONCPU state-mask sync (TSK_ONCPU is a mask bit, not a task count: no NR_ONCPU counter and no identical_state heuristic in the switch), the per-cgroup PSI accounting switch (cgroup.pressure, carried in the cgroup's flags word so that neither struct psi_group nor struct cgroup grows -- the ACK 6.1 psi_group pointer/parent rework stays unported), lazy-preemption and lock-wakeup hooks, MADV_COLLAPSE), the android15-6.6 forms of zram recompression plus zsmalloc chain-size sizing, and the Batch 8 page_alloc fallback-mode reuse/claimability cleanup plus RCU_NOCB_CPU_DEFAULT_ALL (enabled by the module tier since Batch 16 -- while it was merely opt-in no tier ever turned it on, so the graft compiled out and the group still reported applied), the Batch 9-1 OPLUS/Xiaomi dynamic-readahead low-memory background cap, and the Batch 10 line (zram async recompress worker, secondary zram compressor registered at device creation, schedutil smart-freq PELT policy (disabled by default and gated to schedutil DVFS ownership since Batch 10-5, because a FAS/WALT owner pins min==max and a floor then becomes a ceiling lock), cached-freeze-reclaim proactive accounting, cgroup-v1 memory.reclaim and tally) Batch 36 (memcg, v0.38.0) and Batch 37 (MGLRU v6.14, v0.39.0): the memcg per-cpu stats objects are allocated compact while the header structs stay byte-identical (KMI-neutral reshape), and the MGLRU v6.14 performance series (v4) lands as six groups re-authored onto the 6.1-shape page-based MGLRU this baseline carries -- deactivation short-circuit, aging feedback with int swappiness, type selection, the max_seq-windowed refault recency test, and the dirty-tail flusher wake. as bounded anchor scripts: per-group shape preflight, transactional replace steps, and report-only degradation instead of half-patched trees; a real defconfig lane enables the module-owned Kconfig symbols (ZRAM_TRACK_ENTRY_ACTIME, ZRAM_MULTI_COMP, ABK_DYNAMIC_READAHEAD, RCU_NOCB_CPU_DEFAULT_ALL and LRU_GEN_ENABLED are on by default -- the last one because CONFIG_LRU_GEN alone leaves MGLRU compiled but runtime-off, /sys/kernel/mm/lru_gen/enabled reading 0x0000, which is what made Batch 37's six MGLRU groups inert; ABK_515_DEFCONFIG_ALIGN=1 adds the remaining five 6.6-GKI defaults) and non-android13-5.15 lineages are report-only unless ABK_515_ALLOW_UNSUPPORTED=1. stable_display_fix removes the 5.15.185 drm valid-clones encoder check that breaks vendor msm_drm atomic commits (black screen) on 5.15.185+ and the lts branch. New exported-struct fields only reuse free ANDROID_KABI_RESERVE slots; since Batch 15 this module ALSO owns the sched_entity slots 1-3 (the absorbed EEVDF family: deadline/min_vruntime/vlag; Batch 16 released slot 4 -- the suite's u64 slice was written once and read nowhere in the tree) and request_queue slot 1 (the absorbed blk_mq_async_depth), so ABK_ABI_PATCH_SUITE must NOT be injected into the same build -- the two claim the same KMI slots and are mutually exclusive. Gating is by tree shape, never by sublevel, so one injection covers every supported baseline (a group whose upstream commit the baseline already carries reports already_present). Security-only fixes are out of scope. A companion KernelSU module (ksu/abk_runtime_tunables, bundled into the AnyKernel3 zip and built by scripts/build_ksu_module.py) enforces the measured zram algorithm policy on device -- primary lz4kd, read-only 0444 zstd secondary, mem_limit 25% of RAM -- drives the age-marked recompression sweeps through the async worker, follows each sweep with one gated zsmalloc compaction pass, reports the remaining runtime knobs (MGLRU, THP, abk_sf, dynamic readahead, cgroup-v1 proactive reclaim), adds the narrow kernel-domain SELinux rules the zram writeback data path needs under Enforcing (Batch 18; one per backing-file type, because the ROM's extm backs its loop device with extm_data_file rather than zram_data_file), and records at boot which governor owns each cpufreq policy plus the kernel's FAS registration (/proc/fas), warning when the smart-freq floor is armed against a FAS/WALT owner. Batch 15 (v0.20.0) retires the ABK_ABI_PATCH_SUITE red line and absorbs that suite's optimization inventory, so this module is self-sufficient instead of depending on a second external module: the absorbed groups are the pid/fd/close_range allocation hotpaths, the SLUB and anonymous-THP fault hotpaths, blk_mq_async_depth (request_queue slot 1), the EEVDF scheduler family (sched_entity slots 1-3) and the nohz/avg_idle scheduler refinements, and the absorption fixed four latent defects in the suite's own implementations (an alloc_pid() retry that used continue in a descending loop and could return a pid whose numbers[0].nr was never written, a request-count value assigned into bfq/kyber's per-word bit cap so both throttles were dead code, an unconditional rq->idle_stamp sample that reads nanoseconds-since-boot on a CPU that never passed newidle_balance(), and a reweight_entity() whole-body anchor that silently matched no sublevel on 5.15.194/.216). Batch 16 (v0.21.0) is the emptiness-audit follow-up: it removes the suite's exported nohz accessor pair and its four per-state predicates (zero callers across the full GKI tree -- dead KMI surface), releases sched_entity slot 4, and enables CONFIG_RCU_NOCB_CPU_DEFAULT_ALL in the module tier so Batch 8's offload_all machinery is no longer a provably-always-false branch; a new unit test asserts every Kconfig symbol this module introduces is enabled by some tier, which is what would have caught that one. ZRAM_WRITEBACK stays ROM-tier opt-in: the target ROM disables zram setup outright, so a default-on would buy nothing there and hand a flash-wear capability to every other ROM. What could not be absorbed is recorded with evidence in docs/survey_suite_absorption.md (the io_uring groups target the post-5.18 split layout while 5.15 ships an 11116-line monolith; swap_table needs mm/swap.h and struct folio, neither of which exists on 5.15; bpf_timer/bpf_wq anchors are absent from 5.15 AND 6.1; the suite's zram compressed_writeback is a stub with no I/O path). Composable with other ABK modules via documented injection order (docs/porting_policy.md). Batch 17 adds the zram writeback line: writeback bio batching with a per-device writeback_batch_size (default 32) that keeps several bios in flight instead of one submit_bio_wait() per page, carrying the upstream wb_ctl use-after-free fix (bf62f69574b1) and reserved-block leak fix (3e8d8eb8d7f5) from the first new line, plus compressed (raw zspool object) writeback with on-demand decompression on the read path -- re-anchored to 5.15, which needs no zsmalloc rewrite because zs_map_object() already returns a contiguous copy of a spanning object. Batch 18 (v0.23.0) is a distribution-asset fix rather than a graft: the companion ships one sepolicy.rule -- allow kernel zram_data_file file { read write } -- and submits it through ksud at post-fs-data, because the loop worker that reads and writes a zram backing file runs in the kernel domain and Android's policy has no rule for that direction; without it every writeback page returned -EIO on the vermeer ROM, the ROM's own loop49 backing store included (bd_stat stayed 0 0 0). v0.30.1 fixes a defect in Batch 14's zram_writeback_bounds step: it derived nr_pages unconditionally after the mode parse, clobbering the single-iteration bound PAGE_WRITEBACK sets, so page_index=N swept from N to the end of the device instead of one page -- and because the sweep loop counts iterations from index, page_index>=1 walked zram_slot_lock() past zram->table and panicked the kernel on vermeer (level 3 translation fault at index 4194304 == nr_pages on a 16 GiB device; x1 == 0x400000 in the register dump). PAGE mode's bound is now restored after the range check. The companion (v0.10.0) adds the writeback sweep the kernel never triggers on its own -- zram.writeback.trigger, off by default, huge vs idle, per-pass budget re-armed and clamped to the backing device -- and the second SELinux rule so the policy names the backing-file type actually in use. Batch 30 (v0.32.0) ports the v6.18 mmap_miss concurrent-fault guard (e338d8353154) into mm/filemap.c: the per-file mmap_miss decrement in do_async_mmap_readahead() now sits behind a page-lock test, so several threads faulting the same page cannot each decrement the counter for that one page -- which undershot its increment side in do_sync_mmap_readahead() and held mmap read-around on while the file's pages were evicted and re-faulted under memory pressure (the upstream evidence is a Google production fleet measurement, 10-20x fewer containers stuck in a reclaim cycle; this module claims no device-side speedup, only upstream alignment). No Cc: stable and no Fixes:, so no 5.15 baseline carries it -- android13-5.15-lts included -- and the backport is the only path. The 5.15-only FAULT_FLAG_SPECULATIVE decrement in filemap_fault() is deliberately left alone: upstream deleted that whole path, so no upstream commit fixes it and the graft corrects the dominant site only. Batch 31 (v0.33.0) adds core's arm64_pte_mkwrite_clean: the 5.15.196 arm64 pte_mkwrite() guard (mainline 143937ca51cc, v6.18), which clears PTE_RDONLY only for an already software-dirty PTE. PAGE_SHARED on arm64 is clean by default (PTE_RDONLY|PTE_WRITE), so the unconditional clear marked every writable page hardware-dirty and try_to_unmap() wrote unwritten pages back at reclaim; the group is the 5.15.y form (5.15 has no pte_mkwrite_novma()) and the module's first arch/arm64 C group. Batch 32 (v0.34.0) repairs the accounting of a written-back slot in the Batch-17 zram writeback line: zram_writeback_complete() no longer runs zram_free_page() over the slot, because that helper resets the flags and attributes the paths keep reading (obj_size and priority for the compressed read, ZRAM_HUGE for the raw one) and its ->huge_pages decrement was never given back by re-setting ZRAM_HUGE, so the slot's final release decremented the counter a second time and underflowed it; the release is open-coded instead (the zsmalloc object, compr_data_size and the huge page, plus ZRAM_IDLE), pages_stored stays unchanged in both directions, and zram_free_page() skips its own huge-page decrement for a ZRAM_WB slot (mainline b0377ee80429 / ACK android16-6.12 37b72d525502, Fixes: d38fab605c667). Batch 33 (v0.35.0) shrinks the zs_free() critical section in mm/zsmalloc.c (7ef28e8b8142): a dead zspage now hands its pages back to the buddy allocator after class->lock is dropped, instead of waiting on the zone lock with the class lock held. Patches 1-2 of the same series are deliberately not ported -- they delete a pool-level rwlock read side that android13-5.15 does not have (mm/zsmalloc.c contains no pool->lock on any baseline). Batch 34 (v0.36.0) adds core's arm64_lse_percpu_load_atomics (mainline 535fdfc5a228, v6.18, arm64-fixes): the non-return per-CPU atomic operations on arm64 become load LSE atomics (LDADD/LDCLR/LDSET with an unused but non-XZR destination) instead of the store forms (STADD/STCLR/STSET), which tend to execute far in the interconnect while load atomics execute near (L1) -- the motivation is back-to-back STADD on the SRCU lock path. KMI-neutral header asm; the commit never reached linux-5.15.y; the upstream-measured fentry-benchmark regression (bpf-next merge c2f2f005a1c2) does not apply because 5.15 arm64 has no BPF trampoline so the recursion-detection enter/exit helpers are unreachable; all upstream evidence is Neoverse-V2-only and no speedup is claimed for Snapdragon targets without device A/B. Batch 35 (v0.37.0; the MADV_DONTNEED page-table pair removed in v0.42.0, see below) adds the page-cache and page-table line as two ordered pairs: truncate_shadow_batch (61c663e020d2, v6.11) clears the shadow entries of a whole pagevec under one acquisition of the i_pages lock instead of one lock/walk per entry -- the shape behind the upstream 11s soft-lockup in clear_shadow_entry() under invalidate_bdev() -- and truncate_shadow_batch_sweep (d3db2c042591, v6.13) then rewrites that helper into one xas_for_each() traversal of the batch index span; madvise_pt_reclaim (6375e95f381e, v6.14) handed the PTE page of a range MADV_DONTNEED had just emptied back to the buddy allocator behind a new zap_details.reclaim_pt mark, and madvise_batch_tlb_flush (43c4cfde7e37, v6.16) gave one madvise(MADV_DONTNEED) request a single mmu_gather instead of one per VMA -- BOTH REMOVED in v0.42.0: freeing an empty PTE page under mmap_read_lock races the smaps/reclaim page-table walkers on 5.15 (no pmdp_get_lockless()/RCU pte_offset_map*, so no walker re-validates), which panicked in smaps_pte_range on vermeer; upstream also gates PT_RECLAIM behind ARCH_SUPPORTS_PT_RECLAIM, which arm64 did not select at v6.14, and the footprint win is negligible off the huge-sparse-mapping server workload. Only the shadow-entry pair remains (core 59 -> 57).5.15 shape rewrites, not copies: no pmdp_get_lockless() on any baseline, so only upstream own lock-protected try_to_free_pte() fallback is ported (it re-decides under the pmd lock, so zap_pte_range() does not have to track skipped entries); no madvise_behavior struct, so the gather is threaded through madvise_walk_vmas() explicitly; no MADV_DONTNEED_LOCKED, and MADV_FREE still owns its own gather, so madvise_batch_tlb_flush() lists MADV_DONTNEED only; no folio_batch on 5.15, so the shadow sweep uses a pagevec, and __clear_shadow_entry() is kept because the truncate path still calls it. The free side mirrors free_pte_range() own CONFIG_SPECULATIVE_PAGE_FAULT barrier, which upstream helper has no counterpart for, and relies on MMU_GATHER_RCU_TABLE_FREE (arm64 selects it unconditionally; upstream 6.14 gated PT_RECLAIM on ARCH_SUPPORTS_PT_RECLAIM, which arm64 did not select at the time -- the lock-protected-only port needs no arch opt-in). Three further commits of the same area are excluded for having no carrier on android13-5.15 (see the exclusion record in plan.md): 7a1eb89f7918 and d5ea5e5e50df target 5.18+ readahead code (read_pages() never adjusts ra->size here, and there is no page_cache_ra_order()), and 0faa77afe72b optimises a double refcount update that does not exist in the single-page filemap_map_pages() this tree still has. Batch 36 (v0.38.0) ports the FUSE write-path prefault move (mainline faa794dd2e17, v6.16): fuse_fill_write_pages() faults the write source buffer in only where copy_page_from_iter_atomic() made no progress, so the common path costs one userspace access per write(2) through a daemon instead of two, while the no-progress retry keeps its fault-in for forward progress (upstream v6.16's rationale is that generic_perform_write() faults only on no progress -- true of upstream 6.11+, not of 5.15's own copy, which still faults at the loop head; what makes this safe here is that the retry fault lands after unlock_page() / put_page(), and the atomic copy never faults). The erofs half of the same batch (file-backed mounts, fb176750266a + 6422cde1b0d5) is excluded with evidence: fs/erofs on every tracked baseline is the iomap-era tree and carries none of the metabuf layer or fs/erofs/fileio.c prerequisites those commits (and the two they build on) require, so landing them alone would produce a mount whose every inode returns -EOPNOTSUPP; lib/iov_iter 770c8d55c428 is inapplicable for the same kind of reason (5.15 has no page_folio()/folio_test_slab() in that file). Both exclusions, and the decision to leave FUSE passthrough unported, are recorded in plan.md. Batch 37 (v0.39.0) adds the six-group memory-reclaim chain on the memory.reclaim line: proactive_reclaim_batch_fidelity (0388536ac291, v6.6) caps one reclaim call at SWAP_CLUSTER_MAX and proactive_reclaim_decaying_batches (287d5fedb377, v6.9, Fixes: the former) replaces that cap with a decaying batch -- the two are inseparable, because the fixed cap cost more in reclaim start/stop cycles than it saved in overreclaim (upstream 13742 vs 67352 pages/sec on a full root-cgroup reclaim); reclaim_swappiness_defines (410abb20acae) and proactive_reclaim_swappiness_arg (68cd9050d871, same v6.11 series) add MIN_SWAPPINESS/MAX_SWAPPINESS and the swappiness=<val> nested key to memory.reclaim, carried to the scan balance by a new sc_swappiness() accessor and documented in cgroup-v2.rst; proactive_reclaim_suspend_abort (dc37771a43d4, v7.2, Fixes: 287d5fedb377) lets the PM freezer interrupt a proactive reclaim (MGLRU signal check plus -ERESTARTSYS, so the syscall restarts after resume instead of failing the suspend); and lru_add_drain_dead_folios (9669b87065a6, v7.2) frees a page whose last reference is the lru_add batch own before it reaches the LRU, in 5.15 pagevec form -- the module first mm/swap.c group. Everything in the chain but the last group rewrites the memory_reclaim() this module generates, so each superseded group stops on a probe of its successor (AGENTS.md trap 5) and  Batch 38 (v0.43.0) is the first cut of the v7.2 MM/reclaim survey (docs/survey_7_2_mm_reclaim.md; 366 mm/ commits delimited by tag reachability rather than committer date): huge_memory_imap_split_uaf (e923bd21058e, carried as the 5.15.y backport f87c08060818 -- unlock i_mmap before releasing the after-split folios so the final unlock cannot dereference an RCU-freed inode), swap_readahead_lru_add_drain (a4519e5b648a -- drop the two 2.6-era lru_add_drain() calls at the tail of swap_cluster_readahead() and swap_vma_readahead(); a third one in free_pages_and_swap_cache() is correctly kept), vmscan_tasks_rcu_qs (25f52e812168, carried as 4cdc1bdf4094; the 5.15 macro is unconditional and the device check found CONFIG_TASKS_RCU=y alongside CONFIG_TASKS_TRACE_RCU=y with real call_rcu_tasks/synchronize_rcu_tasks symbols, so the classic holdout clear IS compiled in and the group does change behaviour here -- the first draft's 'compiles back to cond_resched()' claim was wrong, and no speedup is claimed only because none was measured), filemap_mmap_miss_tried (9b0fcac3cfe7 -- guard the filemap_map_pages() per-PTE mmap_miss decrement, NOT the filemap_fault() one, whose mainline analogue lives in do_async_mmap_readahead() and is not the site upstream patches), memcg_dying_bailout (0beeaf14e7b9 + e13f634f50d5 + 757dd8193f6c + 10228e0a5123 -- all five reclaim loops check CSS_DYING so a concurrent cgroup_rmdir() waiting on cgroup_mutex cannot stall the whole machine), and buddyinfo_nolock (aaa98b100ea8 -- /proc/buddyinfo stops taking zone->lock for a counter it only reads, while the pagetypeinfo_showfree() reader that does need the lock is left alone). core 57 -> 63. Batch 39 (v0.44.0) lands pagealloc_batch_clear (b001cf7d16dd): kernel_init_free_pages() clears the whole contiguous allocation with one memset instead of numpages kmap_atomic()/clear_page()/kunmap_atomic() round trips, and the dropped per-page KASAN tag pair is a provable no-op on this baseline (page_kasan_tag_reset() is page_kasan_tag_set(page, 0xff) and the set writes the saved value back, so page->flags ends where it started; arm64's page_address() is lowmem_page_address() and carries no tag). Implementing it also corrected a premise the device check had left wrong: 5.15's kasan_has_integrated_init() IS kasan_hw_tags_enabled(), so with HW-tags KASAN active post_alloc_hook() lets KASAN zero the pages and never reaches this function at all. core 63 -> 64. The v7.2 MGLRU reclaim-loop series is recorded as NOT portable: this baseline's MGLRU is a different, older implementation (6-arg should_run_aging() that computes nr_to_scan itself, 4-arg get_nr_to_scan(), lru_gen_shrink_lruvec() with can_swap threaded through the helpers, isolate_pages() with no isolatedp out-param chain, and no for_each_evictable_type() or root_reclaim()), so the series rests on six intervening refactors and a faithful port is a ~500-line restructure of the device's primary reclaim path rather than a graft; three of its twelve commits are already-present no-ops here and 12316f7902f8 -- the one that looked most phone-relevant -- is largely already the 5.15 behaviour.the registry keeps them in dependency order."
