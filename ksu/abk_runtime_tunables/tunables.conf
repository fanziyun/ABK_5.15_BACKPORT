# ABK 5.15 Runtime Tunables - on-device policy.
#
# Format: key=value, `#` starts a comment.  An EMPTY value means "leave the
# kernel exactly as it is"; an unknown key is reported in logcat (tag
# ABK-Tunables) and ignored.
#
# What this file CANNOT change, on purpose: the zram algorithms, the compressed
# memory cap and the swap size.  They are measured constants in the module
# (primary lz4kd, secondary zstd, mem_limit 25% of RAM, size inherited from the
# ROM).  See README.md for the measurements and the reasoning.

# --- zram recompression sweeps -------------------------------------------
# enable=1 drives the kernel's async recompression worker (Batch 10-1/10-4);
# it is the only part of this module that is on by default, because a
# recompression mechanism that nothing triggers has never recompressed a page.
zram.recomp.enable=1
# only pages untouched for this long are marked cold before a pass; must stay
# shorter than the first sweep's arrival (~30 min after boot) or the boot mark is empty.
zram.recomp.idle_age_sec=900
# seconds between sweeps
zram.recomp.interval_sec=1800
# seconds between MARK steps.  Must stay slower than the sweep (a mark re-arms
# pages a pass just cleared); Batch 47's skip predicate makes re-armed
# already-optimal pages free, so the drain rate is sweep-cadence x budget
# (2 x 512 MiB per hour), not the mark clock -- an hourly mark only picks up
# newly cold pages sooner.
zram.recomp.mark_interval_sec=3600
# only recompress entries at least this large (0 = every marked page)
zram.recomp.threshold=0
# how many entries ONE sweep may attempt (0 = no cap): the cap bounds pass cost,
# and marks re-arm already-optimal pages, so 131072 (512 MiB) keeps new cold pages
# reachable.  A kernel without the max_pages graft ignores the value.
zram.recomp.max_pages=131072
# async (the kernel worker) or sync
zram.recomp.mode=async

# --- zsmalloc compaction (rides the sweep tick above) --------------------
# After every recompression sweep the supervisor runs ONE full `compact` pass,
# but only when both gates below agree the device is fragmented (measured
# kill-storm numbers and the reasoning: README.md).  A healthy device is
# therefore never compacted for nothing, and zram.recomp.enable=0 stops the
# sweeps and this gate with them.
zram.compact.enable=1
# wasted bytes (mem_used_total - compr_data_size) that must be exceeded, in MiB
zram.compact.min_waste_mb=50
# overhead percentage over compr_data_size that must be exceeded
zram.compact.waste_pct=15

# --- zram writeback (Batch 11) -------------------------------------------
# zram can move its coldest compressed pages to a backing device, which frees
# RAM at the cost of flash writes.  The nodes it needs are only writable before
# `disksize`, and `reset` drops the attachment -- which is why writeback and the
# algorithm policy used to exclude each other.  The module restores the
# attachment it finds instead of sacrificing it, and:
#   off (default)  never attach one.  A device attached from another file is
#                  still preserved; a backing file this module created is
#                  released, and one left behind with nothing attached to it is
#                  removed at the first pass
#   auto           attach a backing file when the kernel supports writeback,
#                  nobody owns it (no backing device, mmd.setup_complete unset)
#                  and the boot has completed (sys.boot_completed=1)
# Why off is the default.  The destination is a per-boot directory, and the
# thing that owns this path is Android's mmd_setup, not a module: AOSP's init.rc
# runs, on every boot,
#   on property:sys.boot_completed=1
#     exec - system system -- /bin/rm -rf /data/per_boot
#     mkdir /data/per_boot 0700 system system encryption=Require key=per_boot_ref
# so /data/per_boot is emptied at every boot and re-keyed with a fresh per-boot
# key -- nothing put there survives a reboot.  AOSP's own mmd uses
# /data/per_boot/zram_swap (system/memory/mmd/src/main.rs) and is started off a
# property its own rc sets at sys.boot_completed, i.e. deliberately after that
# wipe; an attach that races the wipe loses its file and leaves the loop device
# over an unlinked inode (measured on the target device: losetup -a showed the
# ROM's loop49 with an empty backing filename).  `auto` therefore waits for the
# same property.  Nothing on the target ROM consumes a backing device anyway --
# the ROM's extm/mmd never starts (vendor.zram.disable=1,
# init.svc.mmd_setup=stopped), the ROM tier build's CONFIG_ZRAM_WRITEBACK=y is
# not enough on its own, and this file has bd_stat at 0 0 0 -- so attaching one
# only costs a full zram rewrite per boot.  Turning this on is only useful
# together with zram.writeback.trigger below, because the kernel moves a page
# only when userspace asks.
zram.writeback=off
# backing file size in MiB (sparse: only the blocks zram really moves are
# written; 64..8192, clamped)
zram.writeback.size_mb=1024
# --- zram writeback sweep (off by default) -------------------------------
# The trigger the kernel does not have on its own.  A sweep spends flash: every
# page moved costs one 4 KiB write whatever compressed_writeback says, so this
# is opt-in and the budget is per pass, not per boot.
#   off (default)  never trigger; the backing device is still attached/preserved
#   huge           move only incompressible pages.  An incompressible page costs
#                  a whole page of RAM, so this frees 1:1 against the flash --
#                  the cheap mode, and the one to use first.
#   idle           also move compressed pages that have gone cold.  Frees only
#                  about a third of the flash it burns at a 3:1 profile; use it
#                  when zram is genuinely against its mem_limit.
zram.writeback.trigger=off
# flash the sweep may spend per pass, in MiB.  Clamped down to the backing
# device's own size, so a pass cannot run it out of space (1..65536).
zram.writeback.budget_mb=256
# seconds between sweeps (60..; default is one per day, the shape the ROM's own
# extm used -- persist.miui.extm.daily_flush_count is a *daily* budget)
zram.writeback.interval_sec=86400
# trigger=idle only: mark a page idle only if nothing has touched it for this
# many seconds.  Never "all" -- that would move every page on the device in one
# pass (60..2592000).
zram.writeback.idle_age_sec=7200
# seconds between policy re-checks while the supervisor runs.  On a kernel
# without the Batch 11 lock this is how long a runtime algorithm switch
# survives before the module rewrites the device; with the lock it is
# irrelevant, because the switch cannot take effect at all (5..3600).
zram.reassert_interval_sec=60

# --- virtual memory (empty = leave alone) --------------------------------
vm.swappiness=
vm.page_cluster=
vm.watermark_scale_factor=
vm.min_free_kbytes=

# --- kcompressd watchdog (observability only) -----------------------------
# The kernel's kcompressd moves the first swap-out write off the reclaim path
# into a per-node thread and exposes its queue next to it: vm.kcompressd (the
# queue depth at which the caller starts head-draining one page per enqueue,
# i.e. not the ring's capacity; 0 = the mechanism is off) and three monotonic
# counters in pages -- enqueued (handed to the queue), swapped (taken back out
# and written) and sync (never queued: the caller wrote the page itself).
# Queue depth = enqueued - swapped; sync is not part of the queue.  Nothing
# here changes the mechanism; the supervisor only reads it.
#
# Every monitor_interval_sec it logs one line and checks two invariants:
#   depth <= threshold && SwapCached >= swapcached_warn_mb, two checks in a row
#     -> "written-but-not-dropped shape": pages are being written into the swap
#     cache and staying there while the queue is not the backlog, which is what
#     a swapcache leak looks like from userspace.
#   depth >= threshold
#     -> "queue saturated" (the head-drain point): from here every enqueue also
#     writes its oldest page out on the caller's thread, so reclaim pays a
#     synchronous write and the offload is no longer free.  A larger queue
#     hides latency here and spends it on the reclaim path instead, so raise the
#     threshold only after confirming that on the device.
# A threshold of 0 means the kernel has kcompressd switched off, so the queue
# cannot build and the invariants are skipped (the state line is still logged).
# seconds between state lines / invariant checks (min 60)
kcompressd.monitor_interval_sec=600
# SwapCached in MiB at which the first invariant calls the swap cache "large"
kcompressd.swapcached_warn_mb=256
# Override the queue-depth threshold used by the saturation warning.  Empty
# (or 0) = use the kernel's own vm.kcompressd, the head-drain depth it applies.
kcompressd.depth_warn=

# --- memory reclaim --------------------------------------------------------
# 1 turns multigenerational LRU on.  Default is now 0: MGLRU is OFF unless a
# tester opts in.  On SM8550 vermeer this module's MGLRU reclaim-loop rewrite
# (Batch 37/49) does not converge under sustained memory thrash -- two
# kworker/*:*H pin at 100% kernel CPU in lru_gen_shrink_lruvec, lmkd starves,
# the QCOM watchdog cold-resets the device, and a third-party app (bilibili)
# SIGSEGVs on launch in the dex-preload mmap path.  The identical load with
# MGLRU off rode out (zram took 8.6 GB, PSI self-recovered), so classic LRU is
# the safe default.  The kernel side matches: LRU_GEN_ENABLED moved from the
# module tier back to the opt-in align tier, so the MGLRU grafts stay
# compiled-in but runtime-off.  0 here is also a no-op in the apply direction
# (abk_apply_lru_gen() only ever *writes* on ==1), so this value stops the
# companion from re-asserting MGLRU on; it does not force it off against a
# kernel that enabled it, which is correct -- enabling is the tester's choice.
# The MGLRU reclaim-loop convergence fix is a dedicated follow-up PR.
lru_gen.enable=0
lru_gen.min_ttl_ms=
# seconds between lru_gen re-asserts (min 5)
vm.reassert_interval_sec=60
# always | madvise | never; madvise is what makes MADV_COLLAPSE reachable
thp.mode=

# --- readahead (empty = leave alone) ------------------------------------
# The OPLUS/Xiaomi dynamic-readahead low-memory background cap, from the Batch
# 9-1 graft.  This section once also carried the scheduler and smart-freq
# keys; those moved to sailboat addon 2 (ksu/sailboat_addon_2), together with
# the governor enforcement and the DVFS report.
readahead.dynamic_readahead=

# --- proactive reclaim of cached apps (opt-in) ---------------------------
# Drives the ksu/cgroup memory.reclaim path on frozen/cached groups.
cfr.enable=0
cfr.interval_sec=300
cfr.freeze=0
cfr.quota_mb=
# Which groups to sweep.  Empty = every uid_* group (the AOSP layout).  A ROM
# that names its groups instead (HyperOS keeps the memory controller on v1 with
# freeze-app / game / mimd / protect_memcg_*) needs them listed here, e.g.
# cfr.group=freeze-app game
cfr.group=
# Extra roots for the group search, space separated.  They are appended to the
# tool's two built-ins (/sys/fs/cgroup and /dev/memcg), never substituted for
# them, and the search never descends below a root it is given -- so a ROM that
# nests the per-UID groups one level down has to name that level:
#   cfr.cgroup_root=/dev/memcg/mimd
# On this device that is the difference between sweeping nothing and sweeping
# 1.5 GiB: the v1 tree has no uid_* at the top, and all 87 of them live under
# mimd.  Without this line the sweep of 2026-09-16 found 0 groups and said so
# once a minute; with it, the same sweep finds all 87.
cfr.cgroup_root=
# Keep only groups the platform is currently holding frozen (0|1).  This is what
# makes cfr.cgroup_root safe rather than reckless: a per-UID tree contains the
# app on screen, and reclaiming that one swaps its working set out and refaults
# it on the next touch.  Frozen is the platform's own "this app is cached"
# verdict -- the same one AOSP's CachedAppOptimizer uses before it reclaims.
cfr.frozen_only=0
# Where to ask when a group carries no freezer node of its own.  This ROM's v1
# memcg groups have neither cgroup.freeze nor freezer.state, while the freezing
# actually happens on v2, so the question is bridged by group name: the v1 group
# mimd/uid_N is frozen exactly when some pid under v2 apps/uid_N is.  Only read
# when cfr.frozen_only=1.
#   cfr.frozen_only=1
#   cfr.freezer_root=/sys/fs/cgroup
# Measured on this device 2026-09-16: 6 of the 87 mimd groups were frozen and
# held 1.2 GiB between them, with the foreground app (uid_10321) correctly left
# out.  cfr.group is the other way to get here, and the two compose.
cfr.freezer_root=
# Keep only groups whose every process the platform ranks as a cached app --
# oom_score_adj >= 900, AOSP's CACHED_APP_MIN_ADJ, a rank no process the user can
# see ever reaches (0|1).  This is the wider of the two filters and the one that
# does not wait for the platform to act: the freezer only parks a process once it
# has been cached a while (measured on this device 2026-09-16: 0 frozen in the
# first minutes after boot, then exactly 1 -- a GMS unstable process at adj 945 --
# and stable there for the next 7), while the rank is already correct on the
# first pass.  Same run: cfr.frozen_only selected 1 group where cfr.cached_only
# selected 14.  Every process, not any -- the write reclaims the group, so one
# visible process sharing the uid would be reclaimed with the cached ones.  A
# weaker promise than frozen (a cached app can still fault its pages straight
# back; a frozen one cannot), but it needs no bridge and works anywhere /proc
# does.  The two compose.
cfr.cached_only=0

# --- per-cgroup PSI accounting (opt-in) -------------------------------------
# Every cgroup gets its own pressure numbers by default: each task state change
# derives and times them, up the whole hierarchy, for every group on the path.
# Android has a group per uid and per pid -- 452 of them measured on this device
# -- and nothing reads the per-group files: lmkd, system_server and mimd all read
# the global /proc/pressure/memory.  The cgroup.pressure node is this module's
# own Batch 21 graft (psi_cgroup_pressure_switch, from android14-6.1), so a
# kernel without that batch reports nodes=0 and nothing here changes.  The root
# group is never written -- its switch is psi_system, the global numbers.
#
#   keep        leave every group as the kernel set it (the built-in default)
#   auto        turn off only groups holding no tasks and no memory
#   aggressive  turn off everything outside psi.cgroup.protect, populated or not
#
# Which mode is worth it is a measurement, not an argument (docs/psi_field_protocol.md):
# the saving is charged per state change and the pass costs a tree walk.  And
# measured here first: 314 of the 452 groups held tasks, so auto reaches only the
# 138 empty ones -- and an empty group never runs the code that is being saved,
# because there is no task in it to change state.  auto is therefore a no-op with
# extra steps, and aggressive is the only mode that touches real work.  Neither
# is enabled by default until the two-boot comparison says which one ships.
# Change the value and reboot; the psi: line in the module log says what was
# actually reached, which is the only reading that counts.
#
# There is no "turn it back on" from here.  Batch 21 could restart accounting
# (it frees nothing), but upstream's version of this switch cannot do it safely
# and the companion cannot tell the two kernels apart, so the tool writes only 0
# and the accounting state comes from booting with psi.cgroup=keep.  A disabled
# group's pressure files answer -EOPNOTSUPP rather than showing stale numbers.
psi.cgroup=keep
# Path prefixes that keep their accounting -- a literal prefix of the group path,
# not a whole component.  Deliberately narrow: the per-app groups are most of the
# count and have no readers.  protect_memcg is here because this ROM's own memory
# daemon creates those groups; a daemon that later arms a poll trigger on one of
# them should keep getting numbers rather than -EOPNOTSUPP.
psi.cgroup.protect=system,protect_memcg
# Seconds between passes; a pass catches groups the apps created since the last
# one.  Already-off groups are skipped, so a repeat pass writes nothing (300 min 60).
psi.cgroup.interval_sec=300

# mirror the module log into logcat (the module's own log file under state/ is
# always written, because some ROMs restrict logcat)
report.logcat=1

# --- launch record/prefetch watcher (Stage 2b, the iorapd replacement) ------
# Watches /proc for new app-uid processes and drives the kernel's
# bg_launch_prefetch knobs: a uid is RECORDED once per generation (first
# sighting, or after record_cool_min) and KICKED on every other launch.  The
# kick-only launches never touch the record table, which is what lets a hot
# app's records survive the apps launched in between -- recording on every
# launch churned the table and measurably killed every kick but the most
# recent app's (see CHANGELOG.md Batch 51).  Requires the v0.54+ kernel.
iorap.watch=1
# app UIDs below this are never triggered (system/systemui are 1000-9999)
iorap.min_uid=10000
# minutes between record generations for one uid; 6h matches how often an
# app's on-disk files actually change enough to invalidate old records
iorap.record_cool_min=360
# seconds between kicks of the same uid (spawn bursts of one app count once)
iorap.kick_cool_sec=60
# seconds between ANY two triggers; a launcher fan-out of several apps
# triggers one at a time, the rest are picked up on their next spawn
iorap.global_gap_sec=2

fault_around.enable=Y
fault_around.sys_uid=Y
fault_around.app_only=N
fault_around.app_uids=
swapin.window_enable=Y
swapin.boost_enable=Y
swapin.boost_pages=8
swapin.shrink_enable=1
swapin.shrink_pages=1
swapin.background_only=1
swapin.vma_ra=1
policy.reassert_interval_sec=300
