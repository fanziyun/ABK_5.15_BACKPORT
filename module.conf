ABK_MODULE_ID="abk_5_15_backport"
ABK_MODULE_NAME="ABK 5.15 LTS Backport"
ABK_MODULE_VERSION="0.36.0"
ABK_MODULE_DESCRIPTION="Standalone feature, optimization, structural-refactor backport and display-bringup fix line for the android13-5.15 GKI baselines 5.15.167/.178/.194, grafting selected upstream 5.15.y commits (v5.15.167..v5.15.218; since Batch 20 every non-churn candidate of that survey is either landed or documented as a no-op on the only target architecture, and no group degrades to blocked_by_shape on any supported baseline), the android14-6.1 ACK line (memory.reclaim, PSI IRQ/kernfs polling, the PSI ONCPU state-mask sync (TSK_ONCPU is a mask bit, not a task count: no NR_ONCPU counter and no identical_state heuristic in the switch), the per-cgroup PSI accounting switch (cgroup.pressure, carried in the cgroup's flags word so that neither struct psi_group nor struct cgroup grows -- the ACK 6.1 psi_group pointer/parent rework stays unported), lazy-preemption and lock-wakeup hooks, MADV_COLLAPSE), the android15-6.6 forms of zram recompression plus zsmalloc chain-size sizing, and the Batch 8 page_alloc fallback-mode reuse/claimability cleanup plus RCU_NOCB_CPU_DEFAULT_ALL (enabled by the module tier since Batch 16 -- while it was merely opt-in no tier ever turned it on, so the graft compiled out and the group still reported applied), the Batch 9-1 OPLUS/Xiaomi dynamic-readahead low-memory background cap, and the Batch 10 line (zram async recompress worker, secondary zram compressor registered at device creation, schedutil smart-freq PELT policy (disabled by default and gated to schedutil DVFS ownership since Batch 10-5, because a FAS/WALT owner pins min==max and a floor then becomes a ceiling lock), cached-freeze-reclaim proactive accounting, cgroup-v1 memory.reclaim and tally) as bounded anchor scripts: per-group shape preflight, transactional replace steps, and report-only degradation instead of half-patched trees; a real defconfig lane enables the module-owned Kconfig symbols (ABK_515_DEFCONFIG_ALIGN=1 adds 6.6-GKI defaults) and non-android13-5.15 lineages are report-only unless ABK_515_ALLOW_UNSUPPORTED=1. stable_display_fix removes the 5.15.185 drm valid-clones encoder check that breaks vendor msm_drm atomic commits (black screen) on 5.15.185+ and the lts branch. New exported-struct fields only reuse free ANDROID_KABI_RESERVE slots; since Batch 15 this module ALSO owns the sched_entity slots 1-3 (the absorbed EEVDF family: deadline/min_vruntime/vlag; Batch 16 released slot 4 -- the suite's u64 slice was written once and read nowhere in the tree) and request_queue slot 1 (the absorbed blk_mq_async_depth), so ABK_ABI_PATCH_SUITE must NOT be injected into the same build -- the two claim the same KMI slots and are mutually exclusive. Gating is by tree shape, never by sublevel, so one injection covers every supported baseline (a group whose upstream commit the baseline already carries reports already_present). Security-only fixes are out of scope. A companion KernelSU module (ksu/abk_runtime_tunables, bundled into the AnyKernel3 zip and built by scripts/build_ksu_module.py) enforces the measured zram algorithm policy on device -- primary lz4kd, read-only 0444 zstd secondary, mem_limit 25% of RAM -- drives the age-marked recompression sweeps through the async worker, follows each sweep with one gated zsmalloc compaction pass, reports the remaining runtime knobs (MGLRU, THP, abk_sf, dynamic readahead, cgroup-v1 proactive reclaim), adds the narrow kernel-domain SELinux rules the zram writeback data path needs under Enforcing (Batch 18; one per backing-file type, because the ROM's extm backs its loop device with extm_data_file rather than zram_data_file), and records at boot which governor owns each cpufreq policy plus the kernel's FAS registration (/proc/fas), warning when the smart-freq floor is armed against a FAS/WALT owner. Batch 15 (v0.20.0) retires the ABK_ABI_PATCH_SUITE red line and absorbs that suite's optimization inventory, so this module is self-sufficient instead of depending on a second external module: the absorbed groups are the pid/fd/close_range allocation hotpaths, the SLUB and anonymous-THP fault hotpaths, blk_mq_async_depth (request_queue slot 1), the EEVDF scheduler family (sched_entity slots 1-3) and the nohz/avg_idle scheduler refinements, and the absorption fixed four latent defects in the suite's own implementations (an alloc_pid() retry that used continue in a descending loop and could return a pid whose numbers[0].nr was never written, a request-count value assigned into bfq/kyber's per-word bit cap so both throttles were dead code, an unconditional rq->idle_stamp sample that reads nanoseconds-since-boot on a CPU that never passed newidle_balance(), and a reweight_entity() whole-body anchor that silently matched no sublevel on 5.15.194/.216). Batch 16 (v0.21.0) is the emptiness-audit follow-up: it removes the suite's exported nohz accessor pair and its four per-state predicates (zero callers across the full GKI tree -- dead KMI surface), releases sched_entity slot 4, and enables CONFIG_RCU_NOCB_CPU_DEFAULT_ALL in the module tier so Batch 8's offload_all machinery is no longer a provably-always-false branch; a new unit test asserts every Kconfig symbol this module introduces is enabled by some tier, which is what would have caught that one. ZRAM_WRITEBACK stays ROM-tier opt-in: the target ROM disables zram setup outright, so a default-on would buy nothing there and hand a flash-wear capability to every other ROM. What could not be absorbed is recorded with evidence in docs/survey_suite_absorption.md (the io_uring groups target the post-5.18 split layout while 5.15 ships an 11116-line monolith; swap_table needs mm/swap.h and struct folio, neither of which exists on 5.15; bpf_timer/bpf_wq anchors are absent from 5.15 AND 6.1; the suite's zram compressed_writeback is a stub with no I/O path). Composable with other ABK modules via documented injection order (docs/porting_policy.md). Batch 17 adds the zram writeback line: writeback bio batching with a per-device writeback_batch_size (default 32) that keeps several bios in flight instead of one submit_bio_wait() per page, carrying the upstream wb_ctl use-after-free fix (bf62f69574b1) and reserved-block leak fix (3e8d8eb8d7f5) from the first new line, plus compressed (raw zspool object) writeback with on-demand decompression on the read path -- re-anchored to 5.15, which needs no zsmalloc rewrite because zs_map_object() already returns a contiguous copy of a spanning object. Batch 18 (v0.23.0) is a distribution-asset fix rather than a graft: the companion ships one sepolicy.rule -- allow kernel zram_data_file file { read write } -- and submits it through ksud at post-fs-data, because the loop worker that reads and writes a zram backing file runs in the kernel domain and Android's policy has no rule for that direction; without it every writeback page returned -EIO on the vermeer ROM, the ROM's own loop49 backing store included (bd_stat stayed 0 0 0). v0.30.1 fixes a defect in Batch 14's zram_writeback_bounds step: it derived nr_pages unconditionally after the mode parse, clobbering the single-iteration bound PAGE_WRITEBACK sets, so page_index=N swept from N to the end of the device instead of one page -- and because the sweep loop counts iterations from index, page_index>=1 walked zram_slot_lock() past zram->table and panicked the kernel on vermeer (level 3 translation fault at index 4194304 == nr_pages on a 16 GiB device; x1 == 0x400000 in the register dump). PAGE mode's bound is now restored after the range check. The companion (v0.10.0) adds the writeback sweep the kernel never triggers on its own -- zram.writeback.trigger, off by default, huge vs idle, per-pass budget re-armed and clamped to the backing device -- and the second SELinux rule so the policy names the backing-file type actually in use. Batch 30 (v0.32.0) ports the v6.18 mmap_miss concurrent-fault guard (e338d8353154) into mm/filemap.c: the per-file mmap_miss decrement in do_async_mmap_readahead() now sits behind a page-lock test, so several threads faulting the same page cannot each decrement the counter for that one page -- which undershot its increment side in do_sync_mmap_readahead() and held mmap read-around on while the file's pages were evicted and re-faulted under memory pressure (the upstream evidence is a Google production fleet measurement, 10-20x fewer containers stuck in a reclaim cycle; this module claims no device-side speedup, only upstream alignment). No Cc: stable and no Fixes:, so no 5.15 baseline carries it -- android13-5.15-lts included -- and the backport is the only path. The 5.15-only FAULT_FLAG_SPECULATIVE decrement in filemap_fault() is deliberately left alone: upstream deleted that whole path, so no upstream commit fixes it and the graft corrects the dominant site only. Batch 31 (v0.33.0) adds core's arm64_pte_mkwrite_clean: the 5.15.196 arm64 pte_mkwrite() guard (mainline 143937ca51cc, v6.18), which clears PTE_RDONLY only for an already software-dirty PTE. PAGE_SHARED on arm64 is clean by default (PTE_RDONLY|PTE_WRITE), so the unconditional clear marked every writable page hardware-dirty and try_to_unmap() wrote unwritten pages back at reclaim; the group is the 5.15.y form (5.15 has no pte_mkwrite_novma()) and the module's first arch/arm64 C group. Batch 32 (v0.34.0) repairs the accounting of a written-back slot in the Batch-17 zram writeback line: zram_writeback_complete() no longer runs zram_free_page() over the slot, because that helper resets the flags and attributes the paths keep reading (obj_size and priority for the compressed read, ZRAM_HUGE for the raw one) and its ->huge_pages decrement was never given back by re-setting ZRAM_HUGE, so the slot's final release decremented the counter a second time and underflowed it; the release is open-coded instead (the zsmalloc object, compr_data_size and the huge page, plus ZRAM_IDLE), pages_stored stays unchanged in both directions, and zram_free_page() skips its own huge-page decrement for a ZRAM_WB slot (mainline b0377ee80429 / ACK android16-6.12 37b72d525502, Fixes: d38fab605c667). Batch 33 (v0.35.0) shrinks the zs_free() critical section in mm/zsmalloc.c (7ef28e8b8142): a dead zspage now hands its pages back to the buddy allocator after class->lock is dropped, instead of waiting on the zone lock with the class lock held. Patches 1-2 of the same series are deliberately not ported -- they delete a pool-level rwlock read side that android13-5.15 does not have (mm/zsmalloc.c contains no pool->lock on any baseline). Batch 34 (v0.36.0) adds core's arm64_lse_percpu_load_atomics (mainline 535fdfc5a228, v6.18, arm64-fixes): the non-return per-CPU atomic operations on arm64 become load LSE atomics (LDADD/LDCLR/LDSET with an unused but non-XZR destination) instead of the store forms (STADD/STCLR/STSET), which tend to execute far in the interconnect while load atomics execute near (L1) -- the motivation is back-to-back STADD on the SRCU lock path. KMI-neutral header asm; the commit never reached linux-5.15.y; the upstream-measured fentry-benchmark regression (bpf-next merge c2f2f005a1c2) does not apply because 5.15 arm64 has no BPF trampoline so the recursion-detection enter/exit helpers are unreachable; all upstream evidence is Neoverse-V2-only and no speedup is claimed for Snapdragon targets without device A/B."
