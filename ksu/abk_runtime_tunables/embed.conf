# Files the packager copies into the module zip.
#
# format: <path relative to the repository root>=<path inside the module>
#
# Both device-facing tools stay a single implementation: the scripts in tools/
# are shipped verbatim into bin/ instead of being duplicated here, so a fix to a
# tool cannot drift away from the module.
tools/zram_recompress_trigger.sh=bin/zram_recompress_trigger.sh
tools/cached_freeze_reclaim.sh=bin/cached_freeze_reclaim.sh
