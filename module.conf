ABK_MODULE_SET_NAME="ABK 5.15 LTS Backport"
ABK_MODULE_SET_VERSION="0.7.1"
ABK_MODULE_SET_DESCRIPTION="Feature/optimization backport line for android13-5.15 (baselines 5.15.167/.178/.194): stable_backport_core carries the fd table conventions, page_alloc reserve/THP semantics, cgroup grafts, per-memcg proactive reclaim, zram recompression, zsmalloc chain sizing, MADV_COLLAPSE and an engine-level defconfig lane; stable_perf_backport carries the scheduler NOHZ/PSI/RT, kstack randomization, networking, locking, block PM, OOM observability, and the android14-6.1 PSI / lazy-preemption / lock-wakeup grafts, plus the android15-6.6 zram recompression and zsmalloc chain-size forms."

