cing (Batch 18), drives the age-marked recompression sweeps, follows each sweep with one gated zsmalloc compaction pass, and reports the remaining runtime knobs, and since Batch 13 grafts the android15-6.6 android_vh_customize_alloc_gfp hook (slowpath-entry gfp rewrite point, upstream-shape) together with the ABK high-order slowpath fast-fail policy: while memory is low, THP-class slowpath attempts gain NORETRY and NOWARN instead of stalling the faulting task in the reclaim/compaction loop (page_alloc.abk_gfp_fastfail, abk_gfp_fastfail_order, abk_gfp_fastfail_pct), and since Batch 15 absorbs the ABK_ABI_PATCH_SUITE core optimization groups: the pid/fd/close_range allocation hotpaths (alloc_pid() preload retry with the descending-loop continue bug fixed, abk_expand_files_needed() precheck, bitmap-driven __range_close()), the SLUB shared-prefetch/free-resolution hotpath and the anonymous-THP fault-time allocation helper split, so this module no longer defers those to the suite, and since Batch 30 grafts the v6.18 mmap_miss concurrent-fault guard (e338d8353154) in mm/filemap.c do_async_mmap_readahead(): the mmap_miss decrement moves behind a page-lock test, so concurrent faults on one page cannot drive the per-file counter down repeatedly and hold mmap read-around on while that file is being evicted and re-faulted under memory pressure. Since Batch 31 it also carries the 5.15.196 arm64 pte_mkwrite() dirty guard (mainline 143937ca51cc, v6.18): PTE_RDONLY is cleared only for an already software-dirty PTE, so a writable mapping can stay clean and a page nobody wrote is no longer reported dirty by try_to_unmap() at reclaim -- the live 5.15 call sites are the ones that restore a writable mapping after a transient unmap (remove_migration_pte(), do_numa_page(), userfaultfd), and being an upstream-shape rewrite the group reports already_present on the lts baseline. the Batch 32 written-back-slot release fix (no zram_free_page() over a ZRAM_WB slot: its metadata survives, ->huge_pages is decremented exactly once, and pages_stored is unchanged -- mainline b0377ee80429, Fixes: d38fab605c667), and since Batch 34 the non-return per-CPU atomic operations on arm64 are load LSE atomics instead of store forms (arm64_lse_percpu_load_atomics, mainline 535fdfc5a228, v6.18: the LSE branch of __PERCPU_OP_CASE gains an unused non-XZR destination and the stadd/stclr/stset instantiations flip to ldadd/ldclr/ldset, so the instructions execute near in L1 instead of far in the interconnect -- KMI-neutral header asm, never reached linux-5.15.y, the upstream Neoverse-V2 fentry regression does not apply here because 5.15 arm64 has no BPF trampoline, and no speedup is claimed for Snapdragon targets without device A/B)|https://github.com/xingguangcuican6666/ABK_5.15_backport.git|after_patch|after_patch|after_patch|feature|false|false||
