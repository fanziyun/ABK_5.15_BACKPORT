ABK_MODULE_DESCRIPTION="Standalone feature, optimization, structural-refactor backport and display-bringup fix line for the android13-5.15 GKI baselines 5.15.167/.178/.194, grafting selected upstream 5.15.y commits (v5.15.167..v5.15.218), the android14-6.1 ACK line (memory.reclaim, PSI IRQ/kernfs polling, lazy-preemption and lock-wakeup hooks, MADV_COLLAPSE), the android15-6.6 forms of zram recompression plus zsmalloc chain-size sizing, and the Batch 8 page_alloc fallback-mode reuse/claimability cleanup plus opt-in RCU_NOCB_CPU_DEFAULT_ALL, the Batch 9-1 OPLUS/Xiaomi dynamic-readahead low-memory background cap, and the Batch 10 line (zram async recompress worker, secondary zram compressor registered at device creation, schedutil smart-freq PELT policy (disabled by default and gated to schedutil DVFS ownership since Batch 10-5, because a FAS/WALT owner pins min==max and a floor then becomes a ceiling lock), cached-freeze-reclaim proactive accounting, cgroup-v1 memory.reclaim and tally) as bounded anchor scripts: per-group shape preflight, transactional replace steps, and report-only degradation instead of half-patched trees; a real defconfig lane enables the module-owned Kconfig symbols (ABK_515_DEFCONFIG_ALIGN=1 adds 6.6-GKI defaults) and non-android13-5.15 lineages are report-only unless ABK_515_ALLOW_UNSUPPORTED=1. stable_display_fix removes the 5.15.185 drm valid-clones encoder check that breaks vendor msm_drm atomic commits (black screen) on 5.15.185+ and the lts branch. New exported-struct fields only reuse free ANDROID_KABI_RESERVE slots. Gating is by tree shape, never by sublevel, so one injection covers every supported baseline (a group whose upstream commit the baseline already carries reports already_present). Security-only fixes are out of scope. A companion KernelSU module (ksu/abk_runtime_tunables, bundled into the AnyKernel3 zip and built by scripts/build_ksu_module.py) enforces the measured zram algorithm policy on device -- primary lz4kd, read-only 0444 zstd secondary, mem_limit 25% of RAM -- drives the age-marked recompression sweeps through the async worker, follows each sweep with one gated zsmalloc compaction pass, and reports the remaining runtime knobs (MGLRU, THP, abk_sf, dynamic readahead, cgroup-v1 proactive reclaim), and records at boot which governor owns each cpufreq policy plus the kernel's FAS registration (/proc/fas), warning when the smart-freq floor is armed against a FAS/WALT owner. Composable with other ABK modules via documented injection order (docs/porting_policy.md)."
