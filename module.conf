ABK_MODULE_SET_DESCRIPTION="Feature/optimization backport and display-fix line for android13-5.15 (baselines 5.15.167/.178/.194): stable_backport_core carries the fd table conventions, page_alloc reserve/THP semantics, cpuset bailout and fallback-mode reuse/claimability cleanup, RCU_NOCB_CPU_DEFAULT_ALL (module tier since Batch 16; opt-in meant compiled out), cgroup grafts, per-memcg proactive reclaim, zram recompression, zsmalloc chain sizing, MADV_COLLAPSE, the Batch 9-1 dynamic readahead low-memory background cap, the Batch 10-1 zram async recompress, the Batch 10-4 secondary zram compressor (read-only 0444 zstd, without which recompression is a no-op or recompresses with the algorithm it already used), the Batch 10-4 cgroup-v1 memory.reclaim + reclaim counters, the Batch 10-3 cached-freeze-reclaim proactive accounting, the Batch 12 zram algorithm lock (read-only zram.abk_comp_algo / zram.abk_lock_algo; both algorithm stores become reported no-ops so no runtime writer -- root included -- can reassign them), an engine-level defconfig lane with the module-owned, 6.6-align and ROM-integration tiers, and a companion KernelSU module bundled into the AnyKernel3 zip that keeps the measured on-device zram algorithm policy (lz4kd primary / zstd secondary) in force, preserves or establishes the zram writeback backing device, adds the kernel-domain SELinux rule that path needs under Enforcing (Batch 18), and drives the recompression sweeps and the gated zsmalloc compaction pass; stable_perf_backport carries the scheduler NOHZ/PSI/RT, kstack randomization, networking, locking, block PM, the android14-6.1 PSI / lazy-preemption / lock-wakeup grafts, the Batch 10-2 schedutil smart-freq PELT policy (Batch 10-5: shipped off and inert whenever a non-schedutil governor or a single-operating-point policy owns DVFS, with a read-only zram-style abk_sf_boosting view of the reason state and in-place upgrade of a tree that carries the 10-4c payload), plus the android15-6.6 zram recompression and zsmalloc chain-size forms; Batch 15 absorbs the ABK_ABI_PATCH_SUITE optimization inventory into this module-set (core 27->32 groups, perf 13->18) and makes the two module-sets mutually exclusive, because this one now claims the sched_entity 1-3 and request_queue 1 KMI slots the suite also claims; see docs/survey_suite_absorption.md for the per-feature evidence and the list of suite features that are not portable onto 5.15. stable_display_fix removes the 5.15.185 drm valid-clones check that black-screens vendor msm_drm displays on 5.15.185+ and lts (reports already_present on 5.15.167/.178)."

