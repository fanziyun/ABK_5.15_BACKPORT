name: verify

on:
  workflow_dispatch:
    inputs:
      run_compile:
        description: "Also run the full android13-5.15 kernel compile job"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "module.conf"
      - "setup.sh"
      - "stable_backport.sh"

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit (unit + 167/178/194 tree audits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax gates
        run: |
          python3 -m py_compile scripts/*.py tests/*.py
          bash -n setup.sh scripts/*.sh tests/*.sh tools/*.sh
      - name: Unit tests
        run: python3 tests/stable_5_15_test.py
      - name: Fetch reference trees + step/implementation audits + smoke
        run: |
          set -euo pipefail
          for spec in \
            "deprecated/android13-5.15-2024-11:167" \
            "deprecated/android13-5.15-2025-03:178" \
            "android13-5.15-2025-12:194"; do
            branch="${spec%%:*}"; sub="${spec##*:}"
            bash tests/fetch_sublevel_tree.sh "$branch" "/tmp/tree${sub}"
            ABK_TEST_SUB_LEVEL="${sub}" python3 tests/step_audit.py "/tmp/tree${sub}"
            python3 tests/implementation_audit.py "/tmp/tree${sub}"
            ABK_TEST_SUB_LEVEL="${sub}" bash tests/smoke.sh "/tmp/tree${sub}"
          done
      - name: Summary
        run: echo "audit job green"

  compile:
    name: compile (android13-5.15 GKI kernel)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_compile }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl cpio flex bison libssl-dev bc kmod \
            libelf-dev python3 python3-pip rsync
      - name: Clone android13-5.15 common kernel (5.15.167 baseline)
        run: |
          mkdir -p /tmp/kernel/android13-5.15-X
          git clone --depth 1 --filter=blob:none -b deprecated/android13-5.15-2024-11 \
            https://android.googlesource.com/kernel/common \
            /tmp/kernel/android13-5.15-X/common
          echo "kernel sublevel: $(sed -n 's/^SUBLEVEL = //p' /tmp/kernel/android13-5.15-X/common/Makefile)"
          test -f /tmp/kernel/android13-5.15-X/common/arch/arm64/configs/gki_defconfig
      - name: Fetch AOSP prebuilt clang
        run: |
          mkdir -p /tmp/clang
          curl -sL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r450784d.tar.gz" \
            -o /tmp/clang/clang.tar.gz
          tar -xzf /tmp/clang/clang.tar.gz -C /tmp/clang
          ls /tmp/clang/bin/clang >/dev/null
      - name: Apply ABK 5.15 backport module (core/perf/display children)
        run: |
          set -euo pipefail
          export KERNEL_ROOT=/tmp/kernel/android13-5.15-X
          export DEFCONFIG="$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig"
          for script in abk_stable_core abk_stable_perf abk_stable_display; do
            python3 "scripts/${script}.py" \
              --common-dir "$KERNEL_ROOT/common" \
              --defconfig "$DEFCONFIG" \
              --report-dir /tmp/reports --sub-level 167 --family android13-5.15
          done
          find "$KERNEL_ROOT" -name '*_report.md' -print -exec tail -1 {} \;
      - name: Configure + compile kernel
        run: |
          set -euo pipefail
          export PATH="/tmp/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export CC=clang
          cd /tmp/kernel/android13-5.15-X/common
          make O=/tmp/out LLVM=1 ARCH=arm64 CC=clang gki_defconfig
          make -j"$(nproc)" O=/tmp/out LLVM=1 ARCH=arm64 CC=clang
          echo "=== artifacts ==="
          ls -lh /tmp/out/arch/arm64/boot/Image* /tmp/out/vmlinux
