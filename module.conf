ABK_MODULE_ID="abk_5_15_backport"
ABK_MODULE_NAME="ABK 5.15 LTS Backport"
ABK_MODULE_VERSION="0.7.1"
ABK_MODULE_DESCRIPTION="Standalone feature, optimization, and structural-refactor backport line for the android13-5.15 GKI baselines 5.15.167/.178/.194, grafting selected upstream 5.15.y commits (v5.15.167..v5.15.218), the android14-6.1 ACK line (memory.reclaim, PSI IRQ/kernfs polling, lazy-preemption and lock-wakeup hooks, MADV_COLLAPSE) and the android15-6.6 forms of zram recompression plus zsmalloc chain-size sizing as bounded anchor scripts: per-group shape preflight, transactional replace steps, and report-only degradation instead of half-patched trees; a real defconfig lane enables the module-owned Kconfig symbols (ABK_515_DEFCONFIG_ALIGN=1 adds 6.6-GKI defaults) and non-android13-5.15 lineages are report-only unless ABK_515_ALLOW_UNSUPPORTED=1. New exported-struct fields only reuse free ANDROID_KABI_RESERVE slots. Gating is by tree shape, never by sublevel, so one injection covers every supported baseline (a group whose upstream commit the baseline already carries reports already_present). Security-only fixes are out of scope. Composable with other ABK modules via documented injection order (docs/porting_policy.md)."
ABK_MODULE_REPO_URL="https://github.com/xingguangcuican6666/ABK_5.15_backport.git"
ABK_MODULE_SUPPORTED_STAGES="after_patch,before_build"
ABK_MODULE_DEFAULT_STAGE="after_patch"
ABK_MODULE_RECOMMENDED_STAGES="after_patch"

ABK_MODULE_KIND="module_set"
