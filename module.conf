ABK_MODULE_NAME="ABK 5.15 LTS Backport"
ABK_MODULE_VERSION="0.23.0"
ABK_MODULE_DESCRIPTION="Standalone feature, optimization, structural-refactor backport and display-bringup fix line for the android13-5.15 GKI baselines 5.15.167/.178/.194, grafting selected upstream 5.15.y commits (v5.15.167..v5.15.218), the android14-6.1 ACK line (memory.reclaim, PSI IRQ/kernfs polling, lazy-preemption and lock-wakeup hooks, MADV_COLLAPSE), the android15-6.6 forms of zram recompression plus zsmalloc chain-size sizing, and the Batch 8 page_alloc fallback-mode reuse/claimability cleanup plus RCU_NOCB_CPU_DEFAULT_ALL (enabled by the module tier since Batch 16 -- while it was merely opt-in no tier ever turned it on, so the graft compiled out and the group still reported applied), the Batch 9-1 OPLUS/Xiaomi dynamic-readahead low-memory background cap, and the Batch 10 line (zram async recompress worker, secondary zram compressor registered at device creation, schedutil smart-freq PELT policy (disabled by default and gated to schedutil DVFS ownership since Batch 10-5, because a FAS/WALT owner pins min==max and a floor then becomes a ceiling lock), cached-freeze-reclaim proactive accounting, cgroup-v1 memory.reclaim and tally) as bounded anchor scripts: per-group shape preflight, transactional replace steps, and report-only degradation instead of half-patched trees; a real defconfig lane enables the module-owned Kconfig symbols (ABK_515_DEFCONFIG_ALIGN=1 adds 6.6-GKI defaults) and non-android13-5.15 lineages are report-only unless ABK_515_ALLOW_UNSUPPORTED=1. stable_display_fix removes the 5.15.185 drm valid-clones encoder check that breaks vendor msm_drm atomic commits (black screen) on 5.15.185+ and the lts branch. New exported-struct fields only reuse free ANDROID_KABI_RESERVE slots; since Batch 15 this module ALSO owns the sched_entity slots 1-3 (the absorbed EEVDF family: deadline/min_vruntime/vlag; Batch 16 released slot 4 -- the suite's u64 slice was written once and read nowhere in the tree) and request_queue slot 1 (the absorbed blk_mq_async_depth), so ABK_ABI_PATCH_SUITE must NOT be injected into the same build -- the two claim the same KMI slots and are mutually exclusive. Gating is by tree shape, never by sublevel, so one injection covers every supported baseline (a group whose upstream commit the baseline already carries reports already_present). Security-only fixes are out of scope. A companion KernelSU module (ksu/abk_runtime_tunables, bundled into the AnyKernel3 zip and built by scripts/build_ksu_module.py) enforces the measured zram algorithm policy on device -- primary lz4kd, read-only 0444 zstd secondary, mem_limit 25% of RAM -- drives the age-marked recompression sweeps through the async worker, follows each sweep with one gated zsmalloc compaction pass, reports the remaining runtime knobs (MGLRU, THP, abk_sf, dynamic readahead, cgroup-v1 proactive reclaim), adds the one narrow kernel-domain SELinux rule the zram writeback data path needs under Enforcing (Batch 18), and records at boot which governor owns each cpufreq policy plus the kernel's FAS registration (/proc/fas), warning when the smart-freq floor is armed against a FAS/WALT owner. Batch 15 (v0.20.0) retires the ABK_ABI_PATCH_SUITE red line and absorbs that suite's optimization inventory, so this module is self-sufficient instead of depending on a second external module: the absorbed groups are the pid/fd/close_range allocation hotpaths, the SLUB and anonymous-THP fault hotpaths, blk_mq_async_depth (request_queue slot 1), the EEVDF scheduler family (sched_entity slots 1-3) and the nohz/avg_idle scheduler refinements, and the absorption fixed four latent defects in the suite's own implementations (an alloc_pid() retry that used continue in a descending loop and could return a pid whose numbers[0].nr was never written, a request-count value assigned into bfq/kyber's per-word bit cap so both throttles were dead code, an unconditional rq->idle_stamp sample that reads nanoseconds-since-boot on a CPU that never passed newidle_balance(), and a reweight_entity() whole-body anchor that silently matched no sublevel on 5.15.194/.216). Batch 16 (v0.21.0) is the emptiness-audit follow-up: it removes the suite's exported nohz accessor pair and its four per-state predicates (zero callers across the full GKI tree -- dead KMI surface), releases sched_entity slot 4, and enables CONFIG_RCU_NOCB_CPU_DEFAULT_ALL in the module tier so Batch 8's offload_all machinery is no longer a provably-always-false branch; a new unit test asserts every Kconfig symbol this module introduces is enabled by some tier, which is what would have caught that one. ZRAM_WRITEBACK stays ROM-tier opt-in: the target ROM disables zram setup outright, so a default-on would buy nothing there and hand a flash-wear capability to every other ROM. What could not be absorbed is recorded with evidence in docs/survey_suite_absorption.md (the io_uring groups target the post-5.18 split layout while 5.15 ships an 11116-line monolith; swap_table needs mm/swap.h and struct folio, neither of which exists on 5.15; bpf_timer/bpf_wq anchors are absent from 5.15 AND 6.1; the suite's zram compressed_writeback is a stub with no I/O path). Composable with other ABK modules via documented injection order (docs/porting_policy.md). Batch 17 adds the zram writeback line: writeback bio batching with a per-device writeback_batch_size (default 32) that keeps several bios in flight instead of one submit_bio_wait() per page, carrying the upstream wb_ctl use-after-free fix (bf62f69574b1) and reserved-block leak fix (3e8d8eb8d7f5) from the first new line, plus compressed (raw zspool object) writeback with on-demand decompression on the read path -- re-anchored to 5.15, which needs no zsmalloc rewrite because zs_map_object() already returns a contiguous copy of a spanning object. Batch 18 (v0.23.0) is a distribution-asset fix rather than a graft: the companion ships one sepolicy.rule -- allow kernel zram_data_file file { read write } -- and submits it through ksud at post-fs-data, because the loop worker that reads and writes a zram backing file runs in the kernel domain and Android's policy has no rule for that direction; without it every writeback page returned -EIO on the vermeer ROM, the ROM's own loop49 backing store included (bd_stat stayed 0 0 0)."
