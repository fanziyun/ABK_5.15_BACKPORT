ABK_MODULE_SET_DESCRIPTION="Feature/optimization backport and display-fix line for android13-5.15 (baselines 5.15.167/.178/.194): stable_backport_core carries the fd table conventions, page_alloc reserve/THP semantics, cpuset bailout and fallback-mode reuse/claimability cleanup, RCU_NOCB_CPU_DEFAULT_ALL (module tier since Batch 16; opt-in meant compiled out), cgroup grafts, per-memcg proactive reclaim, zram recompression, zsmalloc chain sizing, MADV_COLLAPSE, the Batch 9-1 dynamic readahead low-memory background cap, the Batch 10-1 zram async recompress, the Batch 10-4 secondary zram compressor (read-only 0444 zstd, without which recompression is a no-op or recompresses with the algorithm it already used), the Batch 10-4 cgroup-v1 memory.reclaim + reclaim counters, the Batch 10-3 cached-freeze-reclaim proactive accounting, the Batch 12 zram algorithm lock (read-only zram.abk_comp_algo / zram.abk_lock_algo; both algorithm stores become reported no-ops so no runtime writer -- root included -- can reassign them), an engine-level defconfig lane with the module-owned, 6.6-align and ROM-integration tiers, and a companion KernelSU module bundled into the AnyKernel3 zip that keeps the measured on-device zram algorithm policy (lz4kd primary / zstd secondary) in force, preserves or establishes the zram writeback backing device, adds the kernel-domain SELinux rule that path needs under Enforcing (Batch 18), and drives the recompression sweeps and the gated zsmalloc compaction pass; stable_perf_backport carries the scheduler NOHZ/PSI/RT, kstack randomization (every KABI shape, always slot 8), excess-steal-time drop, networking, locking, block PM (suspend abort + quiesced elevator switch), the android14-6.1 PSI / lazy-preemption / lock-wakeup grafts (PSI IRQ pressure, PSI trigger kernfs polling, the per-cgroup cgroup.pressure accounting switch, the ONCPU state-mask sync), the Batch 10-2 schedutil smart-freq PELT policy (Batch 10-5: shipped off and inert whenever a non-schedutil governor or a single-operating-point policy owns DVFS, with a read-only zram-style abk_sf_boosting view of the reason state and in-place upgrade of a tree that carries the 10-4c payload), plus the android15-6.6 zram recompression and zsmalloc chain-size forms; Batch 15 absorbs the ABK_ABI_PATCH_SUITE optimization inventory into this module-set (core 27->32 groups, perf 13->18) and makes the two module-sets mutually exclusive, because this one now claims the sched_entity 1-3 and request_queue 1 KMI slots the suite also claims; see docs/survey_suite_absorption.md for the per-feature evidence and the list of suite features that are not portable onto 5.15. stable_display_fix removes the 5.15.185 drm valid-clones check that black-screens vendor msm_drm displays on 5.15.185+ and lts (reports already_present on 5.15.167/.178). Batch 30 (v0.32.0) adds core's readahead_mmap_miss_race: the v6.18 mmap_miss concurrent-fault guard (e338d8353154), which moves the mmap_miss decrement in mm/filemap.c do_async_mmap_readahead() behind a page-lock test so concurrent faults on one page cannot drive the per-file counter down repeatedly and keep mmap read-around enabled under memory pressure. The commit has no Cc: stable, so the group applies on all four baselines and is never already_present. Batch 31 (v0.33.0) adds core's arm64_pte_mkwrite_clean: the arm64 pte_mkwrite() dirty guard 5.15.196 already carries, so that a writable mapping can stay clean and an unwritten page is not reported dirty at reclaim; it is an upstream-shape rewrite and therefore already_present on the lts baseline. Batch 32 (v0.34.0) fixes the written-back-slot release in the Batch-17 writeback line (mainline b0377ee80429): no zram_free_page() over a written-back slot, so its metadata survives and ->huge_pages is decremented once, with zram_free_page() skipping its own decrement for ZRAM_WB slots. Batch 33 (v0.35.0) adds zsmalloc_free_zspage_out_of_lock to core: mainline 7ef28e8b8142 moves the zspage page-freeing in zs_free() out of class->lock, so a wait on the buddy allocator zone lock no longer blocks every other zs_free() on the same size class; the pool-level lock patches (1-2) of that series are inapplicable here because android13-5.15 has no pool->lock in mm/zsmalloc.c. Batch 34 (v0.36.0) adds core's arm64_lse_percpu_load_atomics (mainline 535fdfc5a228, v6.18, arm64-fixes): the non-return per-CPU atomic operations on arm64 become load LSE atomics (LDADD/LDCLR/LDSET with an unused but non-XZR destination) instead of the store forms (STADD/STCLR/STSET), which tend to execute far in the interconnect while load atomics execute near (L1) -- the motivation is back-to-back STADD on the SRCU lock path. KMI-neutral header asm; the commit never reached linux-5.15.y; the upstream-measured fentry-benchmark regression (bpf-next merge c2f2f005a1c2) does not apply because 5.15 arm64 has no BPF trampoline so the recursion-detection enter/exit helpers are unreachable; all upstream evidence is Neoverse-V2-only and no speedup is claimed for Snapdragon targets without device A/B."

