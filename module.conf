ABK_MODULE_SET_DESCRIPTION="Feature/optimization backport and display-fix line for android13-5.15 (baselines 5.15.167/.178/.194): stable_backport_core carries the fd table conventions, page_alloc reserve/THP semantics, cpuset bailout and fallback-mode reuse/claimability cleanup, RCU_NOCB_CPU_DEFAULT_ALL (module tier since Batch 16; opt-in meant compiled out), cgroup grafts, per-memcg proactive reclaim, zram recompression, zsmalloc chain sizing, MADV_COLLAPSE, the Batch 9-1 dynamic readahead low-memory background cap, the Batch 10-1 zram async recompress, the Batch 10-4 secondary zram compressor (read-only 0444 zstd, without which recompression is a no-op or recompresses with the algorithm it already used), the Batch 10-4 cgroup-v1 memory.reclaim + reclaim counters, the Batch 10-3 cached-freeze-reclaim proactive accounting, the Batch 12 zram algorithm lock (read-only zram.abk_comp_algo / zram.abk_lock_algo; both algorithm stores become reported no-ops so no runtime writer -- root included -- can reassign them), an engine-level defconfig lane with the module-owned, 6.6-align and ROM-integration tiers, and a companion KernelSU module bundled into the AnyKernel3 zip that keeps the measured on-device zram algorithm policy (lz4kd primary / zstd secondary) in force, preserves or establishes the zram writeback backing device, adds the kernel-domain SELinux rule that path needs under Enforcing (Batch 18), and drives the recompression sweeps and the gated zsmalloc compaction pass; stable_perf_backport carries the scheduler NOHZ/PSI/RT, kstack randomization (every KABI shape, always slot 8), excess-steal-time drop, networking, locking, block PM (suspend abort + quiesced elevator switch), the android14-6.1 PSI / lazy-preemption / lock-wakeup grafts (PSI IRQ pressure, PSI trigger kernfs polling, the per-cgroup cgroup.pressure accounting switch, the ONCPU state-mask sync), the Batch 10-2 schedutil smart-freq PELT policy (Batch 10-5: shipped off and inert whenever a non-schedutil governor or a single-operating-point policy owns DVFS, with a read-only zram-style abk_sf_boosting view of the reason state and in-place upgrade of a tree that carries the 10-4c payload), plus the android15-6.6 zram recompression and zsmalloc chain-size forms; Batch 15 absorbs the ABK_ABI_PATCH_SUITE optimization inventory into this module-set (core 27->32 groups, perf 13->18) and makes the two module-sets mutually exclusive, because this one now claims the sched_entity 1-3 and request_queue 1 KMI slots the suite also claims; see docs/survey_suite_absorption.md for the per-feature evidence and the list of suite features that are not portable onto 5.15. stable_display_fix removes the 5.15.185 drm valid-clones check that black-screens vendor msm_drm displays on 5.15.185+ and lts (reports already_present on 5.15.167/.178). Batch 30 (v0.32.0) adds core's readahead_mmap_miss_race: the v6.18 mmap_miss concurrent-fault guard (e338d8353154), which moves the mmap_miss decrement in mm/filemap.c do_async_mmap_readahead() behind a page-lock test so concurrent faults on one page cannot drive the per-file counter down repeatedly and keep mmap read-around enabled under memory pressure. The commit has no Cc: stable, so the group applies on all four baselines and is never already_present. Batch 31 (v0.33.0) adds core's arm64_pte_mkwrite_clean: the arm64 pte_mkwrite() dirty guard 5.15.196 already carries, so that a writable mapping can stay clean and an unwritten page is not reported dirty at reclaim; it is an upstream-shape rewrite and therefore already_present on the lts baseline. Batch 32 (v0.34.0) fixes the written-back-slot release in the Batch-17 writeback line (mainline b0377ee80429): no zram_free_page() over a written-back slot, so its metadata survives and ->huge_pages is decremented once, with zram_free_page() skipping its own decrement for ZRAM_WB slots. Batch 33 (v0.35.0) adds zsmalloc_free_zspage_out_of_lock to core: mainline 7ef28e8b8142 moves the zspage page-freeing in zs_free() out of class->lock, so a wait on the buddy allocator zone lock no longer blocks every other zs_free() on the same size class; the pool-level lock patches (1-2) of that series are inapplicable here because android13-5.15 has no pool->lock in mm/zsmalloc.c. Batch 34 (v0.36.0) adds core's arm64_lse_percpu_load_atomics (mainline 535fdfc5a228, v6.18, arm64-fixes): the non-return per-CPU atomic operations on arm64 become load LSE atomics (LDADD/LDCLR/LDSET with an unused but non-XZR destination) instead of the store forms (STADD/STCLR/STSET), which tend to execute far in the interconnect while load atomics execute near (L1) -- the motivation is back-to-back STADD on the SRCU lock path. KMI-neutral header asm; the commit never reached linux-5.15.y; the upstream-measured fentry-benchmark regression (bpf-next merge c2f2f005a1c2) does not apply because 5.15 arm64 has no BPF trampoline so the recursion-detection enter/exit helpers are unreachable; all upstream evidence is Neoverse-V2-only and no speedup is claimed for Snapdragon targets without device A/B. Batch 35 (v0.37.0) adds the core page-cache shadow-entry pair (61c663e020d2 clears a pagevec shadow entries under one i_pages acquisition, d3db2c042591 then does it in one xas_for_each traversal), rewritten to 5.15 shape (pagevec instead of folio_batch, __clear_shadow_entry kept for the truncate caller). The MADV_DONTNEED page-table pair it also carried (6375e95f381e madvise_pt_reclaim + 43c4cfde7e37 madvise_batch_tlb_flush) was REMOVED in v0.42.0: on 5.15 the smaps/reclaim page-table walkers do not re-validate the pmd (no pmdp_get_lockless/RCU pte_offset_map*), so freeing an empty PTE page under mmap_read_lock races them and panicked in smaps_pte_range on vermeer; arm64 also did not select ARCH_SUPPORTS_PT_RECLAIM at v6.14 and the footprint win is negligible off a huge-sparse-mapping server workload. Three further commits of that area are excluded as having no carrier on any baseline. Batch 36 (v0.38.0) adds core's fuse_prefault_out_of_write_path: mainline faa794dd2e17 (v6.16) moves the write source-buffer prefault in fuse_fill_write_pages() out of the retry loop head and into the no-progress branch, so a write(2) through a FUSE daemon touches userspace once on the fast path instead of twice, while the retry that can make no progress keeps its fault-in for forward progress. The erofs file-backed-mount pair in the same batch is not portable onto these baselines and is recorded as excluded in plan.md. Batch 37 (v0.39.0) adds the six-group memory-reclaim chain on the memory.reclaim line: proactive_reclaim_batch_fidelity (0388536ac291, v6.6) caps one reclaim call at SWAP_CLUSTER_MAX and proactive_reclaim_decaying_batches (287d5fedb377, v6.9, Fixes: the former) replaces that cap with a decaying batch -- the two are inseparable, because the fixed cap cost more in reclaim start/stop cycles than it saved in overreclaim (upstream 13742 vs 67352 pages/sec on a full root-cgroup reclaim); reclaim_swappiness_defines (410abb20acae) and proactive_reclaim_swappiness_arg (68cd9050d871, same v6.11 series) add MIN_SWAPPINESS/MAX_SWAPPINESS and the swappiness=<val> nested key to memory.reclaim, carried to the scan balance by a new sc_swappiness() accessor and documented in cgroup-v2.rst; proactive_reclaim_suspend_abort (dc37771a43d4, v7.2, Fixes: 287d5fedb377) lets the PM freezer interrupt a proactive reclaim (MGLRU signal check plus -ERESTARTSYS, so the syscall restarts after resume instead of failing the suspend); and lru_add_drain_dead_folios (9669b87065a6, v7.2) frees a page whose last reference is the lru_add batch own before it reaches the LRU, in 5.15 pagevec form -- the module first mm/swap.c group. Everything in the chain but the last group rewrites the memory_reclaim() this module generates, so each superseded group stops on a probe of its successor (AGENTS.md trap 5) and  Batch 38 (v0.43.0) is the first cut of the v7.2 MM/reclaim survey (docs/survey_7_2_mm_reclaim.md; 366 mm/ commits delimited by tag reachability rather than committer date): huge_memory_imap_split_uaf (e923bd21058e, carried as the 5.15.y backport f87c08060818 -- unlock i_mmap before releasing the after-split folios so the final unlock cannot dereference an RCU-freed inode), swap_readahead_lru_add_drain (a4519e5b648a -- drop the two 2.6-era lru_add_drain() calls at the tail of swap_cluster_readahead() and swap_vma_readahead(); a third one in free_pages_and_swap_cache() is correctly kept), vmscan_tasks_rcu_qs (25f52e812168, carried as 4cdc1bdf4094; the 5.15 macro is unconditional and the device check found CONFIG_TASKS_RCU=y alongside CONFIG_TASKS_TRACE_RCU=y with real call_rcu_tasks/synchronize_rcu_tasks symbols, so the classic holdout clear IS compiled in and the group does change behaviour here -- the first draft's 'compiles back to cond_resched()' claim was wrong, and no speedup is claimed only because none was measured), filemap_mmap_miss_tried (9b0fcac3cfe7 -- guard the filemap_map_pages() per-PTE mmap_miss decrement, NOT the filemap_fault() one, whose mainline analogue lives in do_async_mmap_readahead() and is not the site upstream patches), memcg_dying_bailout (0beeaf14e7b9 + e13f634f50d5 + 757dd8193f6c + 10228e0a5123 -- all five reclaim loops check CSS_DYING so a concurrent cgroup_rmdir() waiting on cgroup_mutex cannot stall the whole machine), and buddyinfo_nolock (aaa98b100ea8 -- /proc/buddyinfo stops taking zone->lock for a counter it only reads, while the pagetypeinfo_showfree() reader that does need the lock is left alone). core 57 -> 63. Batch 39 (v0.44.0) lands pagealloc_batch_clear (b001cf7d16dd): kernel_init_free_pages() clears the whole contiguous allocation with one memset instead of numpages kmap_atomic()/clear_page()/kunmap_atomic() round trips, and the dropped per-page KASAN tag pair is a provable no-op on this baseline (page_kasan_tag_reset() is page_kasan_tag_set(page, 0xff) and the set writes the saved value back, so page->flags ends where it started; arm64's page_address() is lowmem_page_address() and carries no tag). Implementing it also corrected a premise the device check had left wrong: 5.15's kasan_has_integrated_init() IS kasan_hw_tags_enabled(), so with HW-tags KASAN active post_alloc_hook() lets KASAN zero the pages and never reaches this function at all. core 63 -> 64. The v7.2 MGLRU reclaim-loop series is recorded as NOT portable: this baseline's MGLRU is a different, older implementation (6-arg should_run_aging() that computes nr_to_scan itself, 4-arg get_nr_to_scan(), lru_gen_shrink_lruvec() with can_swap threaded through the helpers, isolate_pages() with no isolatedp out-param chain, and no for_each_evictable_type() or root_reclaim()), so the series rests on six intervening refactors and a faithful port is a ~500-line restructure of the device's primary reclaim path rather than a graft; three of its twelve commits are already-present no-ops here and 12316f7902f8 -- the one that looked most phone-relevant -- is largely already the 5.15 behaviour.the registry keeps them in dependency order."

